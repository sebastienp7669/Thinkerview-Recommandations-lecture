name: Mirror to Framagit
on: [push]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # important pour tout l'historique
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: https://framagit.org/sebastienp7669/Thinkerview-Recommandations-lecture.git
          target_username: ${{ secrets.FRAMAGIT_USERNAME }}
          target_user_token: ${{ secrets.FRAMAGIT_TOKEN }}

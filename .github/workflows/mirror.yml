name: Mirror to Framagit
on: [push]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FRAMAGIT_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H framagit.org >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Setup Git Config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
    
      - name: Mirror Repository
        run: |
          git remote add mirror git@framagit.org:sebastienp7669/Thinkerview-Recommandations-lecture.git
          git fetch mirror
          git merge mirror/master --allow-unrelated-histories -X ours || true
          git push --all mirror
          git push --tags mirror
